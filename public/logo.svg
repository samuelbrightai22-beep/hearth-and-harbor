<svg width="220" height="48" viewBox="0 0 220 48" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hearth &amp; Harbor">
  <!-- Monogram mark: stylized H with flame + wave -->
  <g>
    <!-- Outer rounded square background -->
    <rect x="2" y="4" width="40" height="40" rx="10" fill="#1A4A4F"/>
    <!-- Flame (hearth) -->
    <path d="M14 30c0-3 1.5-5.5 3-7.5 1 2 2.5 2.5 3 1.5 0.5-2.5-1-5-1.5-6.5 2.5 1.5 4.5 3.5 5.5 6.5 0.7 2.2 0.5 4.5-1 6.2C21 32 18 32.5 16 31.5c-1.3-0.7-2-1.8-2-1.5z" fill="#D97843"/>
    <!-- Wave (harbor) -->
    <path d="M22 36c2 1 4 1 6 0s4-1 6 0 4 1 6 0" stroke="#FAF7F2" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.85"/>
    <path d="M22 38.5c2 1 4 1 6 0s4-1 6 0 4 1 6 0" stroke="#FAF7F2" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>
  <!-- Wordmark -->
  <text x="52" y="22" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="700" fill="#1A4A4F" letter-spacing="0.5">Hearth &amp; Harbor</text>
  <text x="52" y="38" font-family="Georgia, 'Times New Roman', serif" font-size="9" fill="#6B6B6B" letter-spacing="3" font-weight="500">CONSIDERED GOODS</text>
</svg>
